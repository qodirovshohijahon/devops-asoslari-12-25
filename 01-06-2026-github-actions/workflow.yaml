name: CI/CD Pipeline

# 1. Trigger the workflow
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# 2. Define the jobs
jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # 3. Checkout repository code
    - name: Checkout code
      uses: actions/checkout@v4

    # 4. Setup Node.js (or your respective language environment)
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    # 5. Install dependencies
    - name: Install dependencies
      run: npm ci

    # 6. Run tests
    - name: Run tests
      run: npm test

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-test  # Only runs after build-and-test passes
    if: github.ref == 'refs/heads/main'  # Only deploy on main branch pushes

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to Server
      run: echo "Deploying application to production..."
      # Add your actual deployment steps or specific action here
