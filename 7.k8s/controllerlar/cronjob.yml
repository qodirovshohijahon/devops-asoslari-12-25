apiVersion: batch/v1
kind: CronJob
metadata:
  name: hello-cron
spec:
  schedule: "*/1 * * * *"     # har 1 daqiqada
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: hello
            image: busybox:1.28
            imagePullPolicy: IfNotPresent
            command:
            - /bin/sh
            - -c
            - date; echo "Salom, Kubernetes! Men CronJobdan keldim."
          restartPolicy: OnFailure
  successfulJobsHistoryLimit: 3     # muvaffaqiyatli joblar soni
  failedJobsHistoryLimit: 1   
